# Infraestructura local de Closer.
#   Desarrollo:  docker compose -f infra/docker-compose.yml up -d postgres redis
#   Todo el stack (fases siguientes): docker compose -f infra/docker-compose.yml up -d --build
name: closer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: closer
      POSTGRES_PASSWORD: closer
      POSTGRES_DB: closer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closer -d closer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
