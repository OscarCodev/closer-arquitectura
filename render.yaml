# Render Blueprint: crea el servicio de la API de Closer.
# Render → New → Blueprint → elegir este repositorio. Los valores marcados con `sync: false`
# se piden en pantalla (son secretos y no se guardan en el repo).
services:
  - type: web
    name: closer-api
    runtime: docker
    plan: free
    region: virginia          # cerca de Supabase us-east-1 (menor latencia a la base de datos)
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    # El despliegue lo dispara el CD de GitHub solo cuando el CI pasa (deploy hook), no cada push.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_DEV_LOGIN
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-latest
      # ── Secretos (se completan en Render) ──
      - key: DATABASE_URL           # Supabase → Connect → Transaction pooler (6543) + ?pgbouncer=true&connection_limit=5
        sync: false
      - key: DIRECT_DATABASE_URL    # Supabase → Connect → Session pooler (5432)
        sync: false
      - key: SUPABASE_URL           # https://<ref>.supabase.co
        sync: false
      - key: AUTH_JWT_SECRET        # Supabase → JWT Keys → Legacy JWT secret
        sync: false
      - key: REDIS_URL              # Upstash → rediss://default:<password>@<host>:6379
        sync: false
      - key: GEMINI_API_KEY         # Google AI Studio
        sync: false
      - key: CORS_ORIGINS           # URL de la web: https://<proyecto>.vercel.app (luego https://app.<dominio>)
        sync: false
