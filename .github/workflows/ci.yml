# Integración continua: se ejecuta en cada push y en cada pull request.
# Si un paso falla, el commit queda marcado en rojo y el despliegue (cd.yml) no se ejecuta.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Valores solo para CI: sin claves reales, IA y voz simuladas, login de desarrollo.
  DATABASE_URL: postgresql://closer:closer@127.0.0.1:5432/closer?schema=public&connection_limit=10
  DIRECT_DATABASE_URL: postgresql://closer:closer@127.0.0.1:5432/closer?schema=public
  INTEGRATION_DATABASE_URL: postgresql://closer:closer@127.0.0.1:5432/closer
  REDIS_URL: redis://127.0.0.1:6379
  INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/1
  AUTH_JWT_SECRET: ci-secret-de-al-menos-32-caracteres-para-jwt
  AUTH_DEV_LOGIN: 'true'
  AI_PROVIDER: fake
  CORS_ORIGINS: http://localhost:3000

jobs:
  # ── Backend: calidad de código, pruebas unitarias + integración y cobertura ──
  api:
    name: API · lint, tipos, pruebas y cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: closer
          POSTGRES_PASSWORD: closer
          POSTGRES_DB: closer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U closer -d closer" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -w apps/api
      - name: Tipos
        run: npm run typecheck -w apps/api
      - name: Migraciones (verifica que aplican sobre una base vacía)
        run: npm run prisma:deploy -w apps/api
      - name: Pruebas unitarias + integración con cobertura (mínimos exigidos)
        run: npm run test:cov:all -w apps/api
      - name: Resumen de cobertura
        if: always()
        run: |
          node -e "const s=require('./apps/api/coverage/coverage-summary.json').total;console.log('| Métrica | % |\n|---|---|\n'+['lines','statements','functions','branches'].map(k=>'| '+k+' | '+s[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build -w apps/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-api
          path: apps/api/coverage
          retention-days: 14

  # ── Frontend: calidad de código y build de producción ──
  web:
    name: Web · lint, tipos y build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_PUBLIC_VOICE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -w apps/web
      - name: Tipos
        run: npm run typecheck -w apps/web
      - name: Build
        run: npm run build -w apps/web

  # ── End to End: navegador real contra los builds de producción ──
  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: closer
          POSTGRES_PASSWORD: closer
          POSTGRES_DB: closer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U closer -d closer" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_PUBLIC_VOICE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:deploy -w apps/api
      - run: npm run build -w apps/api
      - run: npm run build -w apps/web
      - name: Navegador de Playwright
        run: npx --workspace apps/web playwright install --with-deps chromium
      - name: Pruebas E2E (levanta API y web en modo producción)
        run: npm run test:e2e -w apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
